name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      # With pending changesets this opens/updates a "Version Packages" PR.
      # When that PR is merged (no pending changesets), it publishes to npm.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional once npm trusted publishing is configured for this repo; required for the very first publish.
          NODE_AUTH_TOKEN: ${{ secrets.MY_NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
