name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing + provenance
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      # With pending changesets this opens/updates a "Version Packages" PR.
      # When that PR is merged (no pending changesets), it publishes to npm.
      - uses: changesets/action@v2
        id: changesets
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # npm authenticates through trusted publishing (OIDC via id-token: write), so no npm token is needed.
          NPM_CONFIG_PROVENANCE: "true"
      # Mirror the release to GitHub Packages, for apps whose .npmrc maps @furnas-technology to npm.pkg.github.com.
      # Runs whenever nothing is pending and skips versions already there, so a failed mirror is retried next push.
      - uses: actions/setup-node@v7
        if: steps.changesets.outputs.has-changesets == 'false'
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@furnas-technology"
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@furnas-technology/timeline@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$VERSION is already on GitHub Packages"
          else
            npm publish --registry https://npm.pkg.github.com --provenance=false --ignore-scripts
          fi
