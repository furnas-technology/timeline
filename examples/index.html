<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>@furnas-technology/timeline — demo</title>
		<style>
			:root {
				font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
				color: #1d2433;
			}
			body {
				margin: 0;
				padding: 16px 20px 40px;
				background: #f6f7f9;
			}
			header {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px 24px;
				margin-bottom: 8px;
			}
			h1 {
				font-size: 18px;
				margin: 0;
			}
			.tag {
				font-size: 11px;
				font-weight: 600;
				background: #1f3a93;
				color: #fff;
				border-radius: 4px;
				padding: 2px 6px;
				vertical-align: middle;
			}
			nav {
				display: flex;
				gap: 4px;
			}
			nav button {
				border-radius: 999px;
				padding: 4px 12px;
			}
			#about {
				font-size: 13px;
				color: #445;
				margin-bottom: 10px;
				max-width: 1100px;
			}
			#about p {
				margin: 0 0 4px;
			}
			#tips {
				margin: 4px 0;
				padding-left: 18px;
			}
			#source {
				font-size: 12px;
				color: #667;
			}
			#source a {
				color: #1f3a93;
			}
			.toolbar {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 14px;
				align-items: center;
				padding: 8px 10px;
				background: #fff;
				border: 1px solid #dde1e7;
				border-radius: 8px;
				margin-bottom: 10px;
				font-size: 13px;
			}
			.toolbar fieldset {
				display: flex;
				gap: 4px;
				align-items: center;
				border: 0;
				padding: 0;
				margin: 0;
			}
			.toolbar legend {
				float: left;
				margin-right: 4px;
				color: #667;
			}
			button,
			select {
				font: inherit;
				padding: 3px 8px;
				border: 1px solid #c7ccd4;
				border-radius: 5px;
				background: #fff;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			button[aria-pressed='true'] {
				background: #1f3a93;
				border-color: #1f3a93;
				color: #fff;
			}
			#plan {
				background: #fff;
				border: 1px solid #dde1e7;
				border-radius: 8px;
				padding: 4px 0;
			}
			#log {
				margin-top: 10px;
				font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
				color: #445;
				white-space: pre-wrap;
				max-height: 140px;
				overflow: auto;
			}
			#status {
				color: #667;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>@furnas-technology/timeline <span class="tag">demos</span></h1>
			<nav id="tabs" aria-label="Datasets"></nav>
		</header>
		<section id="about">
			<p id="summary"></p>
			<ul id="tips"></ul>
			<p id="source"></p>
		</section>
		<div class="toolbar">
			<fieldset>
				<legend>Group</legend>
				<select id="preset" aria-label="Grouping"></select>
				<select id="totals" aria-label="Totals depth"></select>
			</fieldset>
			<fieldset>
				<legend>View</legend>
				<button data-action="first" title="First month">⏮</button>
				<button data-action="prev" title="Previous month">◀</button>
				<button data-action="today">Today</button>
				<button data-action="next" title="Next month">▶</button>
				<button data-action="last" title="Last month">⏭</button>
				<select id="months" aria-label="Visible months">
					<option value="3">3 months</option>
					<option value="6">6 months</option>
					<option value="12">12 months</option>
					<option value="24">24 months</option>
					<option value="all">All</option>
				</select>
				<span id="status"></span>
			</fieldset>
			<fieldset>
				<legend>Mode</legend>
				<button data-toggle="yoy" aria-pressed="false">Year over year</button>
				<button data-toggle="merge" aria-pressed="false">Merge overlapping</button>
				<button data-toggle="editable" aria-pressed="false">Editable</button>
			</fieldset>
			<fieldset>
				<legend>Display</legend>
				<button data-action="zoomIn" title="Zoom in">A+</button>
				<button data-action="zoomOut" title="Zoom out">A−</button>
				<button data-action="zoomReset">Reset</button>
				<button data-action="expand">Expand width</button>
				<button data-action="fit">Fit width</button>
				<select id="lines" aria-label="Lines per bar">
					<option value="1">1 line</option>
					<option value="2">2 lines</option>
					<option value="3">3 lines</option>
				</select>
				<select id="calendar" aria-label="Calendar"></select>
				<button data-action="png">Save PNG</button>
			</fieldset>
		</div>
		<div id="plan"></div>
		<div id="log" aria-live="polite"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
